# Databricks Asset Bundle — deploys the UrbanMart pipeline as a Lakeflow Job.
#   databricks bundle validate
#   databricks bundle deploy -t dev
#   databricks bundle run urbanmart_sales_pipeline -t dev
bundle:
  name: urbanmart_sales_datamart

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds the bronze / silver / gold schemas.
    default: urbanmart
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  gold_schema:
    default: gold

targets:
  dev:
    mode: development
    default: true
