# Databricks Asset Bundle — deploys the UrbanMart Lakeflow Job and the AI/BI dashboard.
#   databricks bundle validate -t bootcamp
#   databricks bundle deploy   -t bootcamp
#   databricks bundle run urbanmart_sales_pipeline -t bootcamp
bundle:
  name: urbanmart_sales_datamart

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds the bronze / silver / gold schemas.
    default: urbanmart
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  gold_schema:
    default: gold
  warehouse_id:
    description: SQL warehouse that runs the dashboard queries (looked up by name).
    lookup:
      warehouse: "Serverless Starter Warehouse"

targets:
  # Own workspace (e.g. Databricks Free Edition) with catalog `urbanmart`.
  dev:
    mode: development
    default: true

  # Shared EY bootcamp workspace.
  bootcamp:
    mode: development
    variables:
      catalog: bootcamp
      bronze_schema: um_bronze_antonismp
      silver_schema: um_silver_antonismp
      gold_schema: um_gold_antonismp
